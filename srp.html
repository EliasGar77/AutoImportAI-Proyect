<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Cars | Mobile.de Clone</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* SRP Specific Styles */
    .srp-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      padding: 2rem 0;
    }

    /* Filters Sidebar */
    .filters-sidebar {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      align-self: start;
      position: sticky;
      top: 90px; /* Account for header */
    }
    .filters-sidebar h3 {
      font-size: 1.125rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .filter-group {
      margin-bottom: 1.5rem;
    }
    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .checkbox-item input {
      width: 16px;
      height: 16px;
    }

    /* Results Area */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .results-count {
      font-size: 1.125rem;
      font-weight: 700;
    }
    .sort-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sort-control select {
      width: auto;
      padding: 0.5rem 2rem 0.5rem 1rem;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Car Card styling imported from index but slightly adjusted if needed */
    .car-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .car-card-img {
      position: relative;
      padding-top: 60%;
      background-color: #f1f5f9;
      overflow: hidden;
    }
    .car-card-img img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      transition: transform var(--transition-normal);
    }
    .car-card:hover .car-card-img img {
      transform: scale(1.05);
    }
    .car-badge {
      position: absolute;
      top: 1rem; left: 1rem;
      z-index: 2;
    }
    .car-card-content {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .car-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }
    .car-specs {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .car-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: auto;
    }
    .card-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media(max-width: 900px) {
      .srp-layout {
        grid-template-columns: 1fr;
      }
      .filters-sidebar {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container flex justify-between items-center h-full">
      <a href="index.html" class="logo">Mobile<span>.de</span></a>
      <nav class="nav-links">
        <a href="srp.html">Buy a Car</a>
        <a href="sell.html">Sell Your Car</a>
        <a href="#">Finance</a>
      </nav>
      <div class="user-actions">
        <a href="#" class="btn btn-outline" style="padding: 0.5rem 1rem;">Login</a>
        <a href="sell.html" class="btn btn-secondary" style="padding: 0.5rem 1rem;">List Car</a>
      </div>
    </div>
  </header>

  <!-- Main SRP Area -->
  <div class="container srp-layout">
    
    <!-- Sidebar Filters -->
    <aside class="filters-sidebar">
      <h3>Filters</h3>
      
      <div class="filter-group">
        <label>Make & Model</label>
        <select class="mb-2"><option>Any Make</option></select>
        <select><option>Any Model</option></select>
      </div>
      
      <div class="filter-group">
        <label>Price Range</label>
        <div class="flex gap-2">
          <input type="number" placeholder="Min €">
          <input type="number" placeholder="Max €">
        </div>
      </div>

      <div class="filter-group">
        <label>Registration Year</label>
        <div class="flex gap-2">
          <select><option>From</option><option>2020</option></select>
          <select><option>To</option><option>2024</option></select>
        </div>
      </div>

      <div class="filter-group">
        <label>Fuel Type</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox"> Gasoline</label>
          <label class="checkbox-item"><input type="checkbox"> Diesel</label>
          <label class="checkbox-item"><input type="checkbox"> Electric</label>
          <label class="checkbox-item"><input type="checkbox"> Hybrid</label>
        </div>
      </div>

      <button class="btn btn-primary" style="width: 100%;">Apply Filters</button>

    </aside>

    <!-- Results Area -->
    <main class="results-area">
      <div class="results-header">
        <div class="results-count"><span id="result-count">0</span> Cars Found</div>
        <div class="sort-control">
          <label for="sort" class="text-muted text-sm border-0">Sort by:</label>
          <select id="sort">
            <option>Relevance</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
            <option>Mileage: Low to High</option>
            <option>Newest Listings</option>
          </select>
        </div>
      </div>

      <div class="listings-grid" id="srp-listings">
        <!-- Rendered by JS -->
      </div>
      
      <div class="mt-8 text-center flex justify-center">
        <button class="btn btn-outline">Load More</button>
      </div>
    </main>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('srp-listings');
      const countLabel = document.getElementById('result-count');
      const cars = window.db.cars;
      
      countLabel.innerText = cars.length;

      let html = '';
      cars.forEach(car => {
        const badgeHtml = car.badge ? `<span class="badge badge-success car-badge">${car.badge}</span>` : '';
        html += `
          <a href="detail.html?id=${car.id}" class="card car-card">
            <div class="car-card-img">
              ${badgeHtml}
              <img src="${car.image}" alt="${car.make} ${car.model}">
            </div>
            <div class="car-card-content">
              <h3 class="car-title">${car.make} ${car.model}</h3>
              <div class="car-specs">
                ${car.year} • ${window.db.formatNumber(car.mileage)} km • ${car.fuel}
              </div>
              <div class="car-price">${window.db.formatPrice(car.price)}</div>
              <div class="card-footer">
                <span>${car.sellerType} • ⭐ ${car.sellerRating}</span>
                <span>${car.location}</span>
              </div>
            </div>
          </a>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
